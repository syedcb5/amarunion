function svgBars(d,h=110){const mx=Math.max(1,...d.map(x=>x[1]));return `<svg viewBox="0 0 ${d.length*22} ${h+20}" style="width:100%;height:auto">${d.map((x,i)=>{const bh=x[1]/mx*h;return `<rect x="${i*22+3}" y="${h-bh}" width="16" height="${bh}" rx="3" fill="${i==d.length-1?'#facc15':'#14532d'}"/><text x="${i*22+11}" y="${Math.max(9,h-bh-3)}" font-size="8" text-anchor="middle" fill="#10231a">${x[1]?bn(x[1]):''}</text><text x="${i*22+11}" y="${h+12}" font-size="8" text-anchor="middle" fill="#44574b">${x[0]}</text>`}).join('')}</svg>`}
function donut(parts){const tot=parts.reduce((a,x)=>a+x[1],0),R=44,C=2*Math.PI*R;let off=0;return `<svg viewBox="0 0 120 120" width="120" height="120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#eef2e2" stroke-width="18"/>${parts.map(x=>{const l=tot?x[1]/tot*C:0,e=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${x[2]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return e}).join('')}<text x="60" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">${bn(tot)}</text><text x="60" y="76" text-anchor="middle" font-size="9" fill="#44574b">মোট</text></svg>`}
const hb=(rows,mx,col)=>{mx=mx||Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="hr"><span>${esc(r[0])}</span><div class="b"><i style="width:${Math.min(100,r[1]/mx*100)}%;${col?'background:'+col:''}"></i></div><b>${bn(r[1])}</b></div>`).join('')||'<span class="sub">তথ্য নেই</span>'};

if(!me){A.innerHTML='';L.innerHTML=`<div class="lg"><img src="${LOGO}" alt="আমার ইউনিয়ন"><h2>সুপার অ্যাডমিন প্যানেল</h2><div id="lm"></div><form onsubmit="return dologin(event)"><label>ইউজার আইডি<input name="u" autocomplete="username" required></label><br><label>পাসওয়ার্ড<input name="p" type="password" autocomplete="current-password" required></label><p><button class="btn" style="width:100%">লগইন</button></p></form>${API.mode!='local'?'':`<div class="demo"><b>ডেমো অ্যাকাউন্ট (লোকাল টেস্ট মোড)</b><table>${API.SEED(false).users.map(u=>`<tr><td>${ROLES[u.role]}</td><td><code>${u.uid}</code></td><td><code>${u.pass}</code></td><td><button class="btn s l" onclick="document.querySelector('[name=u]').value='${u.uid}';document.querySelector('[name=p]').value='${u.pass}'">ব্যবহার</button></td></tr>`).join('')}</table></div>`}</div>`;return}
