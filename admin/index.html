async function refresh(q){if(_dirty){toast('সংরক্ষণ চলছে, একটু পরে চেষ্টা করুন');return}try{D=await API.load();ensure();me=D.users.find(x=>x.uid==me.uid)||me;render();if(!q)toast('হালনাগাদ হয়েছে')}catch(e){if(!q)toast('লোড ব্যর্থ: '+e.message)}}
if(API.mode=='local')addEventListener('storage',e=>{if(e.key=='au_db'&&me&&!document.querySelector('.modal'))refresh(true)});
function render(){ensure();const L=$('#login'),A=$('#app');if(!me){A.innerHTML='';L.innerHTML=`<div class="lg"><img src="${LOGO}" alt="আমার ইউনিয়ন"><h2>সুপার অ্যাডমিন প্যানেল</h2><div id="lm"></div><form onsubmit="return dologin(event)"><label>ইউজার আইডি<input name="u" autocomplete="username" required></label><br><label>পাসওয়ার্ড<input name="p" type="password" autocomplete="current-password" required></label><p><button class="btn" style="width:100%">লগইন</button></p></form>${API.mode=='cloud'?'':`<div class="demo"><b>ডেমো অ্যাকাউন্ট (লোকাল টেস্ট মোড)</b><table>${API.SEED(false).users.map(u=>`<tr><td>${ROLES[u.role]}</td><td><code>${u.uid}</code></td><td><code>${u.pass}</code></td><td><button class="btn s l" onclick="document.querySelector('[name=u]').value='${u.uid}';document.querySelector('[name=p]').value='${u.pass}'">ব্যবহার</button></td></tr>`).join('')}</table></div>`}</div>`;return}
L.innerHTML='';const ms=MODS.filter(m=>lvl(m[0])!='none');if(!ms.some(m=>m[0]==mod))mod='dash';
A.innerHTML=`<div class="shell"><aside class="side"><img src="${LOGO}" alt="আমার ইউনিয়ন"><nav>${ms.map(m=>`<a class="${mod==m[0]?'on':''}" onclick="go('${m[0]}')">${m[2]} ${m[1]}</a>`).join('')}</nav></aside><div><div class="topbar"><span><b>${esc(me.name)}</b> <span class="badge">${ROLES[me.role]}</span></span><span><span class="sub">${API.mode=='cloud'?'☁️ ক্লাউড':'💻 লোকাল টেস্ট মোড'}</span> <button class="btn s l" onclick="refresh()">↻ রিফ্রেশ</button> <button class="btn s l" onclick="logout()">লগআউট</button></span></div><main class="main">${R[mod]()}</main></div></div>`}
boot();
</script></body></html>
